name: NutriGuide Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build, unit test and lint native APK
        run: gradle -p android --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify native screens in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle -p android --no-daemon connectedDebugAndroidTest
      - name: Package APK and checksums
        run: |
          mkdir -p android-output
          cp android/app/build/outputs/apk/debug/app-debug.apk android-output/NutriGuide-Native-Android.apk
          sha256sum android-output/NutriGuide-Native-Android.apk > android-output/SHA256SUMS.txt
          cp docs/ANDROID.md android-output/INSTALL-AND-LIMITATIONS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NutriGuide-Native-Android-APK
          path: android-output/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NutriGuide-Android-Lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
