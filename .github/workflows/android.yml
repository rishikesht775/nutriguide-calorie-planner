name: NutriGuide Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint test APK
        run: gradle -p android --no-daemon assembleDebug lintDebug
      - name: Package APK and checksums
        run: |
          mkdir -p android-output
          cp android/app/build/outputs/apk/debug/app-debug.apk android-output/NutriGuide-Android-Test.apk
          sha256sum android-output/NutriGuide-Android-Test.apk > android-output/SHA256SUMS.txt
          cp docs/ANDROID.md android-output/INSTALL-AND-LIMITATIONS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NutriGuide-Android-APK
          path: android-output/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NutriGuide-Android-Lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
