name: NutriGuide application documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/update-docs.mjs
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install -r scripts/docs-requirements.txt
      - run: python scripts/export-application-doc.py
      - uses: actions/upload-artifact@v4
        with:
          name: NutriGuide-Application-Document
          path: docs/exports/NutriGuide-Application-Architecture-and-Requirements.docx
          retention-days: 90
